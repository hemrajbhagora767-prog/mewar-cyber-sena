<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mewar Cyber Crush - Candy Crush Saga</title>
<style>
body{margin:0;background:linear-gradient(180deg,#0f172a,#1e3a8a);color:white;font-family:sans-serif;text-align:center;overflow:hidden}
.header{padding:10px;background:linear-gradient(90deg,#1e3a8a,#f59e0b)}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:350px;margin:10px auto;background:#1e293b;padding:8px;border-radius:15px;box-shadow:0 8px 20px #0008}
.cell{aspect-ratio:1;background:#0f172a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:0.15s;user-select:none;border:2px solid transparent}
.cell.selected{border-color:#f59e0b;transform:scale(1.1);background:#f59e0b22}
.cell.match{animation:blast 0.4s}
@keyframes blast{0%{transform:scale(1)}50%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(0)}}
.score-bar{display:flex;justify-content:space-around;max-width:350px;margin:auto;padding:10px;background:#1e293b;border-radius:12px}
.btn{background:#f59e0b;color:black;border:none;padding:10px 20px;border-radius:25px;font-weight:bold;cursor:pointer;margin:10px}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:5px">⚔️ MEWAR CYBER CRUSH ⚔️</h2>
<p style="margin:0;font-size:12px">Candy Crush jaisa - 3 milao, Fraud Bhagao!</p>
</div>

<div class="score-bar">
<div>Score: <b id="score">0</b></div>
<div>Move: <b id="moves">30</b></div>
<div>Target: <b>500</b></div>
</div>

<div class="board" id="board"></div>

<button class="btn" onclick="initGame()">🔄 Naya Game</button>
<a href="/" style="color:#f59e0b;text-decoration:none;display:block;margin-top:5px">⬅️ Wapas Cyber Sena Portal par</a>

<p style="font-size:11px;opacity:0.7;padding:10px">3 same icon milao - 🛡️📱💳🚨⚔️ - Jai Mewar!</p>

<script>
const icons=['🛡️','📱','💳','🚨','⚔️','🔒'];
let grid=[], score=0, moves=30, first=null;
const boardEl=document.getElementById('board');

function initGame(){
 score=0; moves=30; grid=[];
 for(let i=0;i<49;i++) grid.push(icons[Math.floor(Math.random()*icons.length)]);
 draw(); updateUI();
}
function draw(){
 boardEl.innerHTML='';
 grid.forEach((icon,i)=>{
  let d=document.createElement('div');
  d.className='cell'; d.textContent=icon;
  d.onclick=()=>select(i);
  if(first===i) d.classList.add('selected');
  boardEl.appendChild(d);
 });
}
function select(i){
 if(first===null){ first=i; draw(); return; }
 if(Math.abs(first-i)===1 || Math.abs(first-i)===7){
   [grid[first],grid[i]]=[grid[i],grid[first]];
   if(!hasMatch()){ [grid[first],grid[i]]=[grid[i],grid[first]]; }
   else{ moves--; checkAndClear(); }
 }
 first=null; draw(); updateUI();
 if(moves<=0) setTimeout(()=>alert(`Jai Mewar! Score: ${score}`),200);
}
function hasMatch(){
 for(let r=0;r<7;r++) for(let c=0;c<5;c++){ let idx=r*7+c; if(grid[idx]===grid[idx+1]&&grid[idx]===grid[idx+2]) return true; }
 for(let c=0;c<7;c++) for(let r=0;r<5;r++){ let idx=r*7+c; if(grid[idx]===grid[idx+7]&&grid[idx]===grid[idx+14]) return true; }
 return false;
}
function checkAndClear(){
 let toClear=new Set();
 for(let r=0;r<7;r++) for(let c=0;c<5;c++){ let idx=r*7+c; if(grid[idx]&&grid[idx]===grid[idx+1]&&grid[idx]===grid[idx+2]){ toClear.add(idx); toClear.add(idx+1); toClear.add(idx+2); } }
 for(let c=0;c<7;c++) for(let r=0;r<5;r++){ let idx=r*7+c; if(grid[idx]&&grid[idx]===grid[idx+7]&&grid[idx]===grid[idx+14]){ toClear.add(idx); toClear.add(idx+7); toClear.add(idx+14); } }
 if(toClear.size>0){
  score+=toClear.size*10;
  toClear.forEach(i=>{ document.querySelectorAll('.cell')[i].classList.add('match'); });
  setTimeout(()=>{
   toClear.forEach(i=> grid[i]=icons[Math.floor(Math.random()*icons.length)]);
   draw(); checkAndClear(); updateUI();
  },400);
 }
}
function updateUI(){ document.getElementById('score').textContent=score; document.getElementById('moves').textContent=moves; }
initGame();
</script>
</body>
</html>
